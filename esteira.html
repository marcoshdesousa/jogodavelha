<script>
(function(){
'use strict';
/* ================= constantes (mundo virtual 1000 x 730) ================= */
const VW=1000, VH=730, SPLIT=402;
const PCY=275, BR=27.5, BT=PCY-BR-3.5, TAILX=110, HEADX=890, GROUND=384;
const CY=572, S=1.6, HALF=60, RAIL=74;        // vista de cima: mm -> px
const FX=300, X0=362, G=900, DEG=Math.PI/180;
const NB=78, BW=10;                           // faixas de carga ao longo da correia
const IDLERS=[]; for(let x=170;x<=830;x+=60) if(x<230||x>400) IDLERS.push(x);
const IMPACT=[]; for(let x=240;x<=400;x+=26) IMPACT.push(x);
const FINES=['#4b3730','#3a2c28','#55403a','#43332f','#5e463b'], LUMPS=['#7a5440','#6b4a3a','#8a6450','#5c4033','#7d6a62'];
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const zy=z=>CY+z*S;
const fmt=(v,d=1)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const G_PER=1.5; // gramas de areia por partícula (ilustrativo)

const PARTS={
  funil:{name:'Funil de alimentação',col:'#b8c0c8',dims:'Tronco de pirâmide · topo 70 × 70 mm · saída 30 × 30 mm · altura 50 mm',fn:'Concentra o minério e direciona a queda para o centro.'},
  stonebox:{name:'Stone Box (caixa de pedra)',col:'#ff6b6b',dims:'70 × 50 mm externo · bordas de 15 mm · altura 30 mm · encaixe inferior 30 × 30 mm',fn:'O minério se acumula e forma um colchão: o minério novo bate em minério, não na correia. Pedras e finos se misturam.'},
  defletores:{name:'Defletores ajustáveis (aletas) ×2',col:'#ffc400',dims:'60 × 35 × 8 mm · eixo cilíndrico Ø10 mm · montagem em V',fn:'Giram livremente no eixo, se autoajustam ao fluxo e guiam o material para o centro da correia.'},
  suporte:{name:'Suporte de fixação',col:'#64b5f6',dims:'Peça em U · 40 × 50 × 10 mm · parafuso M10',fn:'Prende o conjunto na estrutura de madeira.'},
  correia:{name:'Correia',col:'#e8ebee',dims:'Borracha · ~120 mm de largura no protótipo',fn:'Carrega o minério do ponto de carga até a descarga.'},
  acion:{name:'Tambor de acionamento + motor',col:'#e8ebee',dims:'Motor (verde) e redutor',fn:'Puxa a correia e gera o movimento.'},
  retorno:{name:'Tambor de retorno',col:'#e8ebee',dims:'Ponta de carga',fn:'Faz a correia voltar por baixo e mantém a tensão.'},
  roletes:{name:'Roletes',col:'#e8ebee',dims:'Rolos de carga (em calha) e de retorno',fn:'Sustentam a correia carregada e o lado de retorno.'},
  impacto:{name:'Roletes de impacto',col:'#e8ebee',dims:'Anéis de borracha, mais juntos, no ponto de carga',fn:'Absorvem parte do choque da queda do minério.'},
  chute:{name:'Chute de transferência (comum)',col:'#ff8a80',dims:'Calha vertical · queda alta, no centro',fn:'O minério cai reto, mas de muito alto: impacto forte e carga sem mistura (pedras e finos separados).'},
  estrutura:{name:'Estrutura',col:'#c9d1d8',dims:'Aço na mina · madeira no protótipo',fn:'Sustenta tambores, roletes e o conjunto. A linha laranja tracejada é o eixo dela.'},
  chave:{name:'Chave de desalinhamento',col:'#ffd27a',dims:'Rolete-sensor ao lado da borda da correia',fn:'Quando a borda empurra o sensor, a luz fica vermelha e o alarme dispara.'},
  giroflex:{name:'Sinalizador (giroflex)',col:'#ffb347',dims:'Luz âmbar',fn:'Pisca quando a correia está desalinhada.'},
  secao:{name:'Seção da correia',col:'#ffb347',dims:'Corte transversal no meio da correia',fn:'Mostra a calha, a carga e o quanto a correia saiu do eixo laranja.'}
};

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function inRect(x,y,r){return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];}
function steel(c,x,y,w,h,base){
  const g=w>=h?c.createLinearGradient(0,y,0,y+h):c.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,base==='dark'?'#5a646c':'#8e9aa3');g.addColorStop(.45,base==='dark'?'#454e55':'#6b7780');g.addColorStop(1,base==='dark'?'#2f363c':'#4c565e');
  c.fillStyle=g;c.fillRect(x,y,w,h);
}
// texturas (padrões) do minério e do chão
const ORE_PAT=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');g.fillStyle='#4a362f';g.fillRect(0,0,64,64);
  for(let i=0;i<260;i++){g.fillStyle=(i%4?FINES:LUMPS)[(Math.random()*5)|0];g.beginPath();g.arc(Math.random()*64,Math.random()*64,rnd(.6,2.4),0,7);g.fill();}
  g.fillStyle='rgba(200,190,185,.35)';for(let i=0;i<40;i++)g.fillRect(Math.random()*64,Math.random()*64,1,1);return cv;})();
const GROUND_PAT=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=96;const g=cv.getContext('2d');g.fillStyle='#5a2f1d';g.fillRect(0,0,96,96);
  for(let i=0;i<500;i++){g.fillStyle=['#4a2716','#6b3a24','#7a4630','#3e2214'][(Math.random()*4)|0];g.fillRect(Math.random()*96,Math.random()*96,rnd(1,2.4),rnd(1,2.4));}return cv;})();

/* ================= simulador ================= */
class Sim{
  constructor(wrap,params,innov){
    this.wrap=wrap;this.canvas=wrap.querySelector('canvas');this.ctx=this.canvas.getContext('2d');
    this.tip=wrap.querySelector('.tip');this.params=params;this.innov=innov;
    this.visible=false;this.ratio=0;this.hover=null;this.onMode=null;
    this.pOre=this.ctx.createPattern(ORE_PAT,'repeat');this.pGround=this.ctx.createPattern(GROUND_PAT,'repeat');
    this.reset();this.resize();

        c.lineWidth=6;c.beginPath();c.moveTo(447,zy(-96)-16);c.lineTo(447,zy(-96)+16);c.lineTo(481,zy(-96)+16);c.lineTo(481,zy(-96)-16);c.stroke();c.fillStyle='#c7ced6';c.beginPath();c.arc(464,zy(-96),5,0,Math.PI*2);c.fill();});
    }else{
      const fw=10+14*clamp(this.fi,0.1,2.2),bz=clamp(this.bias*0.8,-14,14);
      c.save();c.globalAlpha=.9;c.fillStyle=this.pOre;c.beginPath();c.ellipse(FX,zy(bz),fw*0.55,(10+Math.abs(this.bias)*0.4)*S,0,0,7);c.fill();c.restore();
      for(const p of this.ps)if(p.st==='fall'&&p.lump)this.rock(c,p.x,zy(p.z),p);
      this.hl('chute',()=>{c.strokeStyle='#8e98a1';c.lineWidth=5;c.strokeRect(270,zy(-18),60,36*S);c.fillStyle='rgba(60,66,73,.35)';c.fillRect(270,zy(-18),60,36*S);});
      
    }
    for(const f of this.fx){if(f.box)continue;c.strokeStyle=f.col;c.globalAlpha=f.life*Math.min(1,0.35+f.e);c.lineWidth=2;c.beginPath();c.arc(f.x,zy(f.z),(1-f.life)*18*Math.min(1.4,0.4+f.e)+2,0,Math.PI*2);c.stroke();}
    c.globalAlpha=1;
    const gx=962,col=st==='alert'?'#ff3b30':st==='warn'?'#ffb020':'#2ecc71';
    c.strokeStyle='#4b525b';c.lineWidth=4;c.beginPath();c.moveTo(gx,zy(-32));c.lineTo(gx,zy(32));c.stroke();
    c.strokeStyle='#ff7a00';c.lineWidth=2;c.beginPath();c.moveTo(gx-10,CY);c.lineTo(gx+10,CY);c.stroke();
    const my=zy(clamp(dr,-30,30));c.fillStyle=col;c.beginPath();c.moveTo(gx-16,my);c.lineTo(gx-4,my-8);c.lineTo(gx-4,my+8);c.closePath();c.fill();
    c.font='800 17px system-ui';c.textAlign='center';c.fillStyle=col;c.fillText(fmt(dr)+' mm',gx-8,zy(32)+24);
    c.fillStyle='#9aa4ae';c.font='600 14px system-ui';c.fillText('desvio',gx-8,zy(-32)-10);
    this.label(c,'VISTA DE CIMA',10,SPLIT+10);
    c.restore();
  }
  audioState(){return{running:this.params.running,speed:this.params.speed*4,impact:this.impact,innov:this.innov,E:this.params.running?this.frameE*60*(this.innov?0.35:1):0,contact:this.contact,status:this.status()};}
}

/* ================= indicadores ================= */
function buildIndicators(el){
  const K=[['alert','Status'],['drift','Desvio'],['load','Centro da carga'],['impact','Impacto'],['spill','Derramado']];
  el.innerHTML=K.map(([k,t])=>`<div class="ci" data-k="${k}"><span class="l">${t}</span><b class="v">—</b></div>`).join('');
  const R={};K.forEach(([k])=>R[k]=el.querySelector(`[data-k="${k}"]`));return R;
}
const sgn=v=>(v<-0.05?'−':v>0.05?'+':'')+fmt(Math.abs(v));
function updateIndicators(sim,R){
  const set=(k,cls,v)=>{R[k].className='ci '+cls;R[k].querySelector('.v').textContent=v;};
  const st=sim.status(),lc=Math.abs(sim.loadC),im=sim.impact,sp=sim.spilled*G_PER;
  set('alert',st,st==='ok'?'ALINHADA':st==='warn'?'ATENÇÃO':'DESALINHADA');
  set('drift',st,sgn(sim.drift)+' mm');
  set('load',lc<4?'ok':lc<10?'warn':'alert',sgn(sim.loadC)+' mm');
  set('impact',im<35?'ok':im<60?'warn':'alert',fmt(im,0)+'%');
  set('spill',sp<1?'ok':sp<60?'warn':'alert',fmt(sp,0)+' g');
}

/* ================= controles (iguais para as duas correias) ================= */
function buildControls(el,params,sims){
  el.innerHTML=`<button class="btn primary play" type="button"></button><button class="btn reset" type="button">↺ Reiniciar</button>
    <label class="rng"><span>Velocidade <output class="ov"></output></span><input class="sp" type="range" min="0.3" max="2" step="0.1" value="${params.speed}"></label>
    <label class="rng"><span>Vazão de minério <output class="of"></output></span><input class="fl" type="range" min="0.2" max="2" step="0.1" value="${params.flow}"></label>
    <label class="rng"><span>Variação da carga <output class="ovr"></output></span><input class="vr" type="range" min="0" max="2" step="0.1" value="${params.vari}"></label>`;
  const q=s=>el.querySelector(s),play=q('.play'),sp=q('.sp'),fl=q('.fl'),vr=q('.vr');
  const sync=()=>{play.textContent=params.running?'⏸ Pausar':'▶ Iniciar';q('.ov').textContent=fmt(params.speed*0.3,2)+' m/s';q('.of').textContent='≈ '+fmt(22*params.flow*G_PER,0)+' g/s';
    q('.ovr').textContent=params.vari<0.3?'nenhuma':params.vari<0.8?'pequena':params.vari<1.4?'normal':'grande';};
  play.onclick=()=>{params.running=!params.running;sync();};
  q('.reset').onclick=()=>sims.forEach(s=>s.reset());
  sp.oninput=()=>{params.speed=+sp.value;sync();};fl.oninput=()=>{params.flow=+fl.value;sync();};vr.oninput=()=>{params.vari=+vr.value;sync();};
  sync();
}

/* ================= áudio (sintetizado no navegador) ================= */
const AU={ctx:null,on:false,duck:1,
  init(){
    const C=this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=C.createDynamicsCompressor();comp.connect(C.destination);
    const m=this.master=C.createGain();m.gain.value=0;m.connect(comp);
    const nb=this.nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const bb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),bd=bb.getChannelData(0);let last=0;for(let i=0;i<bd.length;i++){last=(last+0.02*(Math.random()*2-1))/1.02;bd[i]=last*3.5;}
    const src=b=>{const s=C.createBufferSource();s.buffer=b;s.loop=true;s.start();return s;};
    const gain=(v,to)=>{const g=C.createGain();g.gain.value=v;g.connect(to||m);return g;};
    const filt=(type,f,q,to)=>{const b=C.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;b.connect(to);return b;};
    this.gM=gain(0);const lp=filt('lowpass',360,0.7,this.gM);
    const o1=C.createOscillator();o1.type='sawtooth';o1.frequency.value=60;o1.connect(lp);o1.start();
    const o2=C.createOscillator();o2.type='sine';o2.frequency.value=120;o2.connect(lp);o2.start();
    this.gW=gain(0);this.wh=C.createOscillator();this.wh.type='sine';this.wh.frequency.value=700;this.wh.connect(this.gW);this.wh.start();
    this.gR=gain(0);src(bb).connect(filt('lowpass',170,0.5,this.gR));
    this.gO=gain(0);this.bpO=filt('bandpass',1300,0.8,this.gO);src(nb).connect(this.bpO);
    this.gS=gain(0);src(nb).connect(filt('bandpass',3400,3,this.gS));
    this.gA=gain(0);this.al=C.createOscillator();this.al.type='square';this.al.frequency.value=720;this.al.connect(filt('lowpass',2200,0.7,this.gA));this.al.start();
  },
  toggle(v){
    if(v===undefined)v=!this.on;if(v&&!this.ctx)this.init();this.on=v;
    if(this.ctx){if(v)this.ctx.resume();this.master.gain.setTargetAtTime(v?0.6*this.duck:0,this.ctx.currentTime,0.15);}
    const b=document.getElementById('snd');b.classList.toggle('on',v);b.textContent=v?'🔊 Som ligado':'🔇 Som';
  },
  setDuck(d){this.duck=d;if(this.on&&this.ctx)this.master.gain.setTargetAtTime(0.6*d,this.ctx.currentTime,0.3);},
  update(st){
    if(!this.ctx||!this.on)return;const t=this.ctx.currentTime,k=0.12;
    if(!st||!st.running){for(const g of[this.gM,this.gW,this.gR,this.gO,this.gS,this.gA])g.gain.setTargetAtTime(0,t,0.2);return;}
    this.gM.gain.setTargetAtTime(0.07*(0.55+st.speed/8),t,k);
    this.wh.frequency.setTargetAtTime(380+st.speed*85,t,0.3);this.gW.gain.setTargetAtTime(0.006,t,k);
    this.gR.gain.setTargetAtTime(0.22*(st.speed/4),t,k);
    this.gO.gain.setTargetAtTime(clamp(st.impact/100,0,1.2)*(st.innov?0.05:0.13),t,k);
    this.bpO.frequency.setTargetAtTime(st.innov?520:1350,t,0.2);
    this.gS.gain.setTargetAtTime(st.contact*0.07,t,k);
    if(st.status==='alert'){this.al.frequency.setValueAtTime(Math.floor(t*2.2)%2?960:720,t);this.gA.gain.setTargetAtTime(0.03,t,0.03);}
    else if(st.status==='warn'){this.al.frequency.setValueAtTime(880,t);this.gA.gain.setTargetAtTime((t%1.2)<0.12?0.02:0,t,0.01);}
    else this.gA.gain.setTargetAtTime(0,t,0.05);
    // pancadas do minério: mais frequentes e fortes sem a inovação
    let n=0,E=st.E;while(n<2&&Math.random()<E*0.0035){this.thump(st.innov);n++;E-=280;}
  },
  thump(soft){
    const C=this.ctx,t=C.currentTime+Math.random()*0.04,A=(soft?0.06:0.2)*rnd(0.45,1);
    const o=C.createOscillator();o.type='sine';o.frequency.setValueAtTime(soft?75:rnd(85,120),t);o.frequency.exponentialRampToValueAtTime(38,t+0.2);
    const g=C.createGain();g.gain.setValueAtTime(A,t);g.gain.exponentialRampToValueAtTime(0.001,t+(soft?0.14:0.28));o.connect(g);g.connect(this.master);o.start(t);o.stop(t+0.32);
    const s=C.createBufferSource();s.buffer=this.nb;const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=soft?450:rnd(1800,3200);
    const g2=C.createGain();g2.gain.setValueAtTime(A*0.9,t);g2.gain.exponentialRampToValueAtTime(0.001,t+(soft?0.05:0.09));s.connect(f);f.connect(g2);g2.connect(this.master);s.start(t,Math.random()*1.5);s.stop(t+0.12);
  }
};

/* ================= montagem ================= */
const P={running:true,speed:1,flow:1,vari:1};
const simA=new Sim(document.getElementById('simA'),P,false);
const simB=new Sim(document.getElementById('simB'),P,true);
const sims=[simA,simB];
buildControls(document.getElementById('ctl'),P,sims);
const indA=buildIndicators(document.getElementById('indA')),indB=buildIndicators(document.getElementById('indB'));

let last=performance.now(),uiT=0;
function loop(now){
  requestAnimationFrame(loop);
  try{frame(now);}catch(e){console.error(e);}
}
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  // as duas correias andam juntas (mesmo tempo, mesmo minério); só desenha o que está na tela
  if(sims.some(s=>s.visible)){
    for(const s of sims){if(P.running){const n=dt>1/50?2:1;for(let i=0;i<n;i++)s.update(dt/n);}s.draw();}
  }
  const vis=sims.filter(s=>s.visible&&s.ratio>0.2);let st=null;
  if(vis.length){st=vis[0].audioState();for(const s of vis.slice(1)){const b=s.audioState();st.E+=b.E;st.impact=Math.max(st.impact,b.impact);st.contact=Math.max(st.contact,b.contact);if(b.status==='alert')st.status='alert';}if(vis.length>1)st.innov=false;}
  AU.update(st);
  uiT+=dt;if(uiT>0.15){uiT=0;updateIndicators(simA,indA);updateIndicators(simB,indB);}
}
requestAnimationFrame(loop);
document.getElementById('snd').onclick=()=>AU.toggle();

window.__SIM={simA,simB,AU,fast:(s,sec)=>{for(let i=0;i<sec*60;i++)s.update(1/60);}};
})();
</script>
