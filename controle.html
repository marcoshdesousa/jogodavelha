<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15181c">
<title>Passador de slides – Escuderia Vanguarda</title>
<style>
:root{--bg:#15181c;--panel:#1f242a;--panel2:#262c33;--line:#333b44;--text:#e8ebee;--muted:#9aa4ae;--orange:#ff7a00;--ok:#2ecc71;--alert:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));gap:12px;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:1rem;margin:0}header h1 span{color:var(--orange)}
#st{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:#3a2a00;color:#ffb020;white-space:nowrap}
#st.wait{background:#3a2a00;color:#ffb020}#st.ok{background:rgba(46,204,113,.15);color:var(--ok)}#st.err{background:rgba(255,59,48,.15);color:#ff8a80}
.now{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.now .n{font-size:.8rem;color:var(--muted);font-weight:700}
.now .t{font-size:1.15rem;font-weight:800;margin-top:2px;min-height:1.4em}
.timer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center}
.timer .lbl{font-size:.75rem;letter-spacing:.1em;color:var(--muted);font-weight:800}
#clock{font-size:3.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
#clock.run{color:var(--orange)}
#mins{font-size:.9rem;color:var(--muted);min-height:1.2em;margin-bottom:8px}
.tb{display:flex;gap:10px}
.tb button{flex:1}
button{appearance:none;font:inherit;font-weight:800;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:14px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
#tStart{background:var(--ok);border-color:var(--ok);color:#06210f}
#tStart.pause{background:#ffb020;border-color:#ffb020;color:#2a1c00}
.nav{flex:1;display:grid;grid-template-columns:1fr 1.6fr;gap:12px;min-height:180px}
.nav button{font-size:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button span{font-size:.85rem;font-weight:700;opacity:.8}
#bNext{background:var(--orange);border-color:var(--orange);color:#111;font-size:2rem}
#bPrev{font-size:2rem}
.err{font-size:.9rem;color:#ff8a80;text-align:center}
.sigm{background:var(--panel);border:1px solid #4fc3f7;border-radius:14px;padding:10px 12px}
.sigm .lbl{font-size:.72rem;letter-spacing:.08em;color:#4fc3f7;font-weight:800;margin-bottom:8px}
.sigm .tabs,.sigm .scroll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sigm .scroll{margin-top:8px}
.sigm button{padding:10px 4px;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.sigm button span{font-size:.72rem;font-weight:700}
.sigm .tabs button.on{background:#4fc3f7;border-color:#4fc3f7;color:#062433}
.sigm .scroll button{background:#14171b}
.sigm .scroll button:disabled{opacity:.3}
.sigm .tabs.two{grid-template-columns:1fr 1fr}.est{border-color:var(--orange)}.est .lbl{color:var(--orange)}.est .tabs button.on{background:var(--orange);border-color:var(--orange);color:#111}
body.has-est .nav{min-height:140px}
.ver{text-align:center;font-size:.7rem;color:#5b646c}
body.has-sigm .nav{min-height:120px}
</style>
</head>
<body>
<header><h1>Passador · <span>Vanguarda</span></h1><span id="st">conectando…</span></header>
<div class="now"><div class="n" id="num">Slide – / –</div><div class="t" id="tit">Aguardando a apresentação…</div></div>
<div class="timer">
  <div class="lbl">CRONÔMETRO</div>
  <div id="clock">00:00</div>
  <div id="mins">pronto para iniciar</div>
  <div class="tb"><button id="tStart" type="button">▶ Iniciar</button><button id="tReset" type="button">↺ Zerar</button></div>
</div>
<div class="sigm" id="sigm" hidden>
  <div class="lbl">SIGM AO VIVO · toque e aparece no slide</div>
  <div class="tabs">
    <button type="button" data-tab="painel">📊<span>Painel</span></button>
    <button type="button" data-tab="antes">📦<span>Preparação</span></button>
    <button type="button" data-tab="durante">🛠️<span>Execução</span></button>
    <button type="button" data-tab="depois">🗂️<span>Histórico</span></button>
  </div>
  <div class="scroll">
    <button type="button" data-sc="top">⤒<span>Topo</span></button>
    <button type="button" data-sc="up">▲<span>Subir</span></button>
    <button type="button" data-sc="down">▼<span>Descer</span></button>
    <button type="button" data-sc="bottom">⤓<span>Fim</span></button>
  </div>
</div>
<div class="sigm est" id="est" hidden>
  <div class="lbl">ESTEIRA AO VIVO · escolha o traçado</div>
  <div class="tabs two">
    <button type="button" data-tr="real">〰️<span>Curvada</span></button>
    <button type="button" data-tr="reto">➖<span>Reta</span></button>
  </div>
</div>
<div class="nav">
  <button id="bPrev" type="button" aria-label="Slide anterior">◀<span>Voltar</span></button>
  <button id="bNext" type="button" aria-label="Próximo slide">▶<span>Próximo</span></button>
</div>
<div class="ver">versão 2026-11-20e</div>
<script src="relay.js?v=2026-11-20e"></script>
<script>
(function(){
'use strict';
const room=(new URLSearchParams(location.search).get('sala')||'').replace(/[^a-z0-9]/gi,'');
const $=id=>document.getElementById(id);
function st(cls,txt){$('st').className=cls;$('st').textContent=txt;}
if(!room){$('tit').textContent='Abra este controle pelo QR Code da apresentação.';st('err','sem sala');}

let rel=null,lastState=0;const pend=new Map();
function showState(d){
  lastState=Date.now();
  $('num').textContent='Slide '+(d.i+1)+' / '+d.n;$('tit').textContent=d.t||'';
  $('sigm').hidden=!d.sigm;document.body.classList.toggle('has-sigm',!!d.sigm);
  const sc=d.sc||{top:true,end:true};
  document.querySelectorAll('[data-sc]').forEach(b=>{const k=b.dataset.sc;b.disabled=(k==='up'||k==='top')?sc.top:sc.end;});
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',!!d.sigm&&b.dataset.tab===d.tab));
  $('est').hidden=!d.est;document.body.classList.toggle('has-est',!!d.est);
  document.querySelectorAll('[data-tr]').forEach(b=>b.classList.toggle('on',!!d.est&&b.dataset.tr===d.tr));
}
function onMsg(m){
  if(m.k!=='s')return;
  if(m.ack&&pend.has(m.ack)){clearTimeout(pend.get(m.ack).t);pend.delete(m.ack);}
  if(typeof m.i==='number')showState(m);
  refresh();
}
// estado da conexão: verde = apresentação respondendo; amarelo = reconectando sozinho
function refresh(){
  if(!room)return;
  const now=Date.now(),peerOk=rel&&now-rel.peer<35000;
  if(pend.size&&[...pend.values()].some(p=>p.n>=2))st('wait','enviando…');
  else if(peerOk)st('ok','conectado');
  else if(!navigator.onLine)st('err','sem internet');
  else st('wait',rel&&rel.peer?'reconectando…':'conectando…');
}
// envia o comando e repete até a apresentação confirmar (sem executar duas vezes)
function send(cmd){
  if(!rel)return;
  if(navigator.vibrate)navigator.vibrate(25);
  keepAwake();
  const msg={k:'c',c:cmd,id:Math.random().toString(36).slice(2,11)};
  const p={n:0,t:null};pend.set(msg.id,p);
  const go=()=>{if(!pend.has(msg.id))return;p.n++;
    if(p.n>6){pend.delete(msg.id);refresh();return;}
    if(p.n>1)rel.kick();
    rel.send(msg,{force:p.n>1});refresh();
    p.t=setTimeout(go,p.n===1?1200:1800);};
  go();
}
$('bNext').onclick=()=>send('next');
$('bPrev').onclick=()=>send('prev');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));send('sigm:tab:'+b.dataset.tab);});
document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>send('sigm:'+b.dataset.sc));
document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tr]').forEach(x=>x.classList.toggle('on',x===b));send('tr:'+b.dataset.tr);});

if(room&&typeof VGRelay==='function'){
  rel=VGRelay(room,'cel',onMsg,refresh);
  // "oi" logo ao abrir e um sinal de vida a cada 8 s (pede o slide atual)
  const hello=()=>{try{rel.send({k:'c',c:'hello'},{ntfyEvery:30000});}catch(e){}};
  setTimeout(hello,800);setTimeout(hello,2500);setInterval(hello,8000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){rel.kick();setTimeout(hello,500);}});
  setInterval(refresh,1000);
}

// cronômetro
let t0=0,acc=0,run=false,tick=null;
const pad=n=>String(n).padStart(2,'0');
function show(){
  const ms=acc+(run?Date.now()-t0:0),s=Math.floor(ms/1000),m=Math.floor(s/60);
  $('clock').textContent=(m>=60?Math.floor(m/60)+':'+pad(m%60):pad(m))+':'+pad(s%60);
  $('mins').textContent=!run&&!ms?'pronto para iniciar':m<1?'menos de 1 minuto':m===1?'1 minuto':m+' minutos';
}
$('tStart').onclick=()=>{
  if(run){acc+=Date.now()-t0;run=false;clearInterval(tick);}
  else{t0=Date.now();run=true;tick=setInterval(show,250);keepAwake();}
  $('tStart').textContent=run?'⏸ Pausar':'▶ Continuar';$('tStart').classList.toggle('pause',run);$('clock').classList.toggle('run',run);show();
};
$('tReset').onclick=()=>{acc=0;t0=Date.now();if(!run){$('tStart').textContent='▶ Iniciar';}show();};

// mantém a tela do celular acesa durante a apresentação
let lock=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run)keepAwake();});
show();
})();
</script>
</body>
</html>
